name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy-yandex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_REGION: ru-central1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy public directory to Yandex Object Storage
        run: |
          aws s3 sync public/ s3://vorexway-site/ \
            --delete \
            --endpoint-url https://storage.yandexcloud.net \
            --only-show-errors
